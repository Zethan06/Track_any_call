name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ray_integration:
        description: Run the optional local CPU Ray integration test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests -v

  extension:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test vscode/test/*.test.js

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/build_release.py --output dist/release
      - name: Install the wheel and run the archived example from another path
        shell: bash
        run: |
          smoke_root=$(mktemp -d "$RUNNER_TEMP/callnav smoke.XXXXXX")
          python -m venv "$smoke_root/.venv"
          "$smoke_root/.venv/bin/python" -m pip install --no-index --no-deps dist/release/*.whl
          mkdir "$smoke_root/project"
          tar -xzf dist/release/*-source.tar.gz --strip-components=1 -C "$smoke_root/project"
          cd "$smoke_root/project"
          "$smoke_root/.venv/bin/callnav" --version
          PYTHON="$smoke_root/.venv/bin/python" "$smoke_root/.venv/bin/callnav" record --root "$PWD" -- bash examples/mini_pipeline/launch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: callnav-release
          path: dist/release/
          if-no-files-found: error

  extension-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exercise the packaged extension in VS Code
        shell: bash
        run: |
          smoke_root=$(mktemp -d "$RUNNER_TEMP/callnav editor.XXXXXX")
          python vscode/scripts/package.py --output "$smoke_root/callnav.vsix"
          python -m venv --without-pip "$smoke_root/python"
          mkdir "$smoke_root/workspace" "$smoke_root/driver"
          cat > "$smoke_root/driver/package.json" <<'JSON'
          {"name":"callnav-test-driver","publisher":"callnav-test","version":"0.0.1","engines":{"vscode":"^1.85.0"},"main":"./driver.js","activationEvents":["*"]}
          JSON
          printf 'exports.activate = () => {};\n' > "$smoke_root/driver/driver.js"
          curl --fail --location --retry 3 https://update.code.visualstudio.com/1.85.2/linux-x64/stable -o "$smoke_root/code.tar.gz"
          tar -xzf "$smoke_root/code.tar.gz" -C "$smoke_root"
          "$smoke_root/VSCode-linux-x64/bin/code" --no-sandbox \
            --user-data-dir="$smoke_root/user" --extensions-dir="$smoke_root/extensions" \
            --install-extension "$smoke_root/callnav.vsix" --force
          CALLNAV_EXPECT_INSTALLED=1 \
          CALLNAV_CAPTURE_WORKSPACE="$smoke_root/workspace" \
          CALLNAV_CAPTURE_PYTHON="$smoke_root/python/bin/python" \
          xvfb-run -a "$smoke_root/VSCode-linux-x64/code" \
            --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --user-data-dir="$smoke_root/user" --extensions-dir="$smoke_root/extensions" \
            --extensionDevelopmentPath="$smoke_root/driver" \
            --extensionTestsPath="$PWD/vscode/test/capture-host.js" \
            --disable-workspace-trust --skip-welcome --skip-release-notes \
            "$smoke_root/workspace"

  ray:
    if: github.event_name == 'workflow_dispatch' && inputs.ray_integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . 'ray==2.58.0'
      - run: python -m unittest discover -s tests -p test_ray.py -v
        env:
          CALLNAV_TEST_RAY: "1"
          CUDA_VISIBLE_DEVICES: ""
