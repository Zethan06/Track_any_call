[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "callnav"
version = "0.2.0"
description = "Navigate Python source using calls observed during a real run"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[project.scripts]
callnav = "callnav.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["callnav*"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "ruff>=0.9,<1"]

[tool.setuptools]
include-package-data = false

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["validation", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
